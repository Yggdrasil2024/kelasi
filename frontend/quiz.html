<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiz de révision KELASI">
    <title>Quiz - KELASI</title>
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="index.html" class="logo">KELASI</a>
            <div class="nav-links">
                <a href="dashboard.html">Tableau de bord</a>
                <a href="leaderboard.html">Classement</a>
                <a href="profile.html">Profil</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="quiz-section">
            <div class="container">
                <div class="quiz-header">
                    <div>
                        <span class="section-label">Mathématiques</span>
                        <h1>Équations du premier degré</h1>
                    </div>
                    <span class="quiz-counter">Question 1 sur 10</span>
                </div>

                <div class="quiz-progress">
                    <div class="quiz-progress-fill"></div>
                </div>

                <div class="quiz-card card">
                    <span class="question-number">Question 1</span>
                    <h2>Quelle est la solution de l'équation 2x + 4 = 10 ?</h2>

                    <div class="answers">
                        <label class="answer-option">
                            <input type="radio" name="answer" value="2">
                            <span>2</span>
                        </label>

                        <label class="answer-option">
                            <input type="radio" name="answer" value="3">
                            <span>3</span>
                        </label>

                        <label class="answer-option">
                            <input type="radio" name="answer" value="4">
                            <span>4</span>
                        </label>

                        <label class="answer-option">
                            <input type="radio" name="answer" value="5">
                            <span>5</span>
                        </label>
                    </div>

                    <button type="button" class="btn btn-primary quiz-button">
                        Valider ma réponse
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div>
                <a href="index.html" class="logo">KELASI</a>
                <p>Révisions BEPC & Bac en ligne.</p>
            </div>
            <p>©️ 2026 KELASI. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="./assets/js/app.js"></script>
</body>
</html>
