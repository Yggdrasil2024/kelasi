<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connexion à KELASI">
    <title>Connexion - KELASI</title>
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="index.html" class="logo">KELASI</a>
            <div class="nav-links">
                <a href="index.html">Accueil</a>
                <a href="register.html" class="btn btn-primary">S'inscrire</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-header">
                    <span class="section-label">Bienvenue sur KELASI</span>
                    <h1>Se connecter</h1>
                    <p>Connecte-toi pour continuer tes révisions.</p>
                </div>

                <form class="auth-form">
                    <div class="form-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" placeholder="Ton mot de passe" required>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember">
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="#">Mot de passe oublié ?</a>
                    </div>

                    <button type="submit" class="btn btn-primary auth-button">Se connecter</button>
                </form>

                <div class="auth-footer">
                    <p>Tu n'as pas encore de compte ? <a href="register.html">Créer un compte</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div>
                <a href="index.html" class="logo">KELASI</a>
                <p>Révisions BEPC & Bac en ligne.</p>
            </div>
            <p>@2026 KELASI. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="./assets/js/app.js"></script>
</body>
</html>
