<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Créer un compte KELASI">
    <title>Inscription - KELASI</title>
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="index.html" class="logo">KELASI</a>
            <div class="nav-links">
                <a href="index.html">Accueil</a>
                <a href="login.html" class="btn btn-outline">Connexion</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-header">
                    <span class="section-label">Rejoins KELASI</span>
                    <h1>Créer un compte</h1>
                    <p>Crée ton compte pour commencer tes révisions.</p>
                </div>

                <form class="auth-form">
                    <div class="form-group">
                        <label for="fullname">Nom complet</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Ton nom complet" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" placeholder="Choisis un mot de passe" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirmer le mot de passe</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirme ton mot de passe" required>
                    </div>

                    <div class="form-group">
                        <label for="level">Niveau</label>
                        <select id="level" name="level" required>
                            <option value="">Choisis ton niveau</option>
                            <option value="BEPC">BEPC</option>
                            <option value="BAC">Bac</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Les matières que tu souhaites réviser</label>
                        <p class="form-help">Tu peux sélectionner une ou plusieurs matières.</p>

                        <div class="subjects-selection">
                            <label class="subject-option">
                                <input type="checkbox" name="subjects" value="mathematiques">
                                <span>Mathématiques</span>
                            </label>

                            <label class="subject-option">
                                <input type="checkbox" name="subjects" value="francais">
                                <span>Français</span>
                            </label>

                            <label class="subject-option">
                                <input type="checkbox" name="subjects" value="histoire">
                                <span>Histoire</span>
                            </label>

                            <label class="subject-option">
                                <input type="checkbox" name="subjects" value="geographie">
                                <span>Géographie</span>
                            </label>

                            <label class="subject-option">
                                <input type="checkbox" name="subjects" value="svt">
                                <span>SVT</span>
                            </label>

                            <label class="subject-option">
                               <input type="checkbox" name="subjects" value="physique">
                               <span>Physique</span>
                            </label>

                            <label class="subject-option">
                                <input type="checkbox" name="subjects" value="chimie">
                                <span>Chimie</span>
                            </label>

                            <label class="subject-option">
                                <input type="checkbox" name="subjects" value="anglais">
                                <span>Anglais</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="terms" required>
                            <span>J'accepte les conditions d'utilisation</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary auth-button">
                        Créer mon compte
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Tu as déjà un compte ? <a href="login.html">Se connecter</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div>
                <a href="index.html" class="logo">KELASI</a>
                <p>Révisions BEPC & Bac en ligne.</p>
            </div>
            <p>@ 2026 KELASI. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="./assets/js/app.js"></script>
</body>
</html>
